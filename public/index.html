<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <title>Chat con Arduino</title>
</head>

<body class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100">
  <div class="flex h-screen">
    <!-- Sidebar -->
    <aside class="hidden md:block w-64 bg-white dark:bg-gray-800 shadow-lg p-4">
      <ul class="space-y-4">
        <li><a href="#" class="block text-gray-700 dark:text-gray-300 hover:underline">Mensajes</a></li>
        <li><a href="#" class="block text-gray-700 dark:text-gray-300 hover:underline">Gráfica latencia</a></li>
      </ul>
    </aside>

    <!-- Pantalla principal -->
    <main class="flex-1 flex flex-col">
      <!-- Header -->
      <header class="bg-white dark:bg-gray-800 shadow p-4">
        <h1 class="text-2xl font-bold">Chat</h1>
      </header>

      <!-- Mensajes -->
      <section class="flex-1 overflow-y-auto p-4 sm:p-6 space-y-6"></section>

      <!-- Input -->
      <footer class="bg-white dark:bg-gray-800 p-4 border-t border-gray-200 dark:border-gray-700">
        <form class="flex space-x-2 sm:space-x-4" id="msg-form">
          <input type="text" placeholder="Escribe algo..."
            class="flex-1 p-2 border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-black dark:text-white rounded-lg focus:outline-none" 
            maxlength="256"
          />
          <button type="submit" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg">Enviar</button>
        </form>
      </footer>
    </main>
  </div>

  <script type="module">

    // Cargar mensajes desde el servidor al iniciar
    (async () => {
      const response = await fetch('/api/usuarios');
      const data = await response.json();

      console.log(data);

    })();

  </script>
</body>

</html>
